<!DOCTYPE html>
<html lang="pt-BR" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/png" href="assets/images/inbarber-logo.png">
  <link rel="apple-touch-icon" href="assets/images/inbarber-logo.png">

  <title data-i18n="meta.home.title">InBarber</title>
  <meta name="description" data-i18n-content="meta.home.description" content="">

  <!-- Open Graph / redes sociais -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="InBarber">
  <meta property="og:title" data-i18n-content="meta.home.title" content="">
  <meta property="og:description" data-i18n-content="meta.home.description" content="">
  <meta property="og:url" content="https://inbarber.com/">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="canonical" href="https://inbarber.com/">
  <link rel="alternate" hreflang="pt-BR" href="https://inbarber.com/">
  <link rel="alternate" hreflang="en" href="https://inbarber.com/?lang=en">
  <link rel="alternate" hreflang="es" href="https://inbarber.com/?lang=es">
  <link rel="alternate" hreflang="x-default" href="https://inbarber.com/">

  <!-- Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS crítico: evita flash de tema claro antes das folhas carregarem -->
  <style>
    html { background: #09090b; }
    body { margin: 0; color: #fafafa; background: #09090b; font-family: "Inter", system-ui, sans-serif; }
    .no-js [data-reveal] { opacity: 1; transform: none; }
  </style>

  <link rel="stylesheet" href="css/landing-page.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/conta.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/como-funciona.css">
  <link rel="stylesheet" href="css/para-donos.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "InBarber",
    "url": "https://inbarber.com/",
    "inLanguage": ["pt-BR", "en", "es"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://inbarber.com/barbearias.html?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

<body data-page="home">
  <a class="skip-link" href="#main" data-i18n="nav.skip">Pular para o conteúdo</a>

  <!-- ====================================================================
       HEADER — marca à esquerda, ações à direita.
       Sem links de seção: a navegação acontece pelo conteúdo da página.
       ==================================================================== -->
  <header class="header" data-header>
    <div class="container header__inner">
      <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.logoAlt">
        <img class="brand__mark" src="assets/images/inbarber-logo.png" alt="" width="446" height="622" decoding="async">
        <span class="brand__name">In<em>Barber</em></span>
      </a>

      <div class="header__actions">
        <!-- Seletor de idioma: bandeira + código da localidade -->
        <!-- <div class="lang-select" data-lang-select>
          <button type="button" class="lang-select__trigger" data-lang-trigger
                  aria-expanded="false" aria-haspopup="true"
                  data-i18n-attr="aria-label:lang.label|title:lang.label">
            <span class="lang-select__flag" data-lang-flag></span>
            <span class="lang-select__code" data-lang-code></span>
            <svg class="lang-select__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="lang-select__menu" role="group" data-lang-menu
               data-i18n-attr="aria-label:lang.menuLabel" hidden></div>
        </div> -->

        <a class="btn btn--ghost btn--sm header__business" href="para-barbearias.html"
           data-i18n-attr="aria-label:nav.business">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5 5 4h14l1.5 5.5a3 3 0 0 1-5.7 1.6 3 3 0 0 1-5.6 0 3 3 0 0 1-5.7-1.6Z"/><path d="M5 11.4V20h14v-8.6"/><path d="M10 20v-4.5h4V20"/></svg>
          <span class="header__business-full" data-i18n="nav.business"></span>
          <span class="header__business-short" data-i18n="nav.businessShort"></span>
        </a>

        <!-- Conta: sem sessão o botão abre o painel de entrada; com sessão
             ele vira as iniciais do visitante e abre o menu da conta. O
             conteúdo é reescrito por js/conta.js; o que está aqui é o estado
             inicial, que continua legível se o JS não carregar. -->
        <div class="account" data-account>
          <button type="button" class="btn btn--gradient btn--sm header__signin" data-signin
                  data-i18n-attr="aria-label:nav.signIn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 20.5v-1.8a4.2 4.2 0 0 0-4.2-4.2H9.2A4.2 4.2 0 0 0 5 18.7v1.8"/><circle cx="12" cy="7.5" r="3.8"/></svg>
            <span class="header__signin-label" data-i18n="nav.signIn"></span>
          </button>
          <div class="account__menu" data-account-menu hidden></div>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- ==================================================================
         SEÇÃO 1 — HERO
         ================================================================== -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__bg" aria-hidden="true">
        <img class="hero__bg-image"
             src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&amp;fit=crop&amp;w=1600&amp;q=60"
             alt="" width="1600" height="900" fetchpriority="high" decoding="async">
      </div>
      <div class="grid-lines" aria-hidden="true"></div>

      <div class="container hero__inner">
        <div class="hero__content">
          <h1 class="hero__title" id="hero-title" data-i18n-html="hero.titleHtml" data-reveal></h1>

          <p class="hero__subtitle" data-i18n="hero.subtitle" data-reveal style="--reveal-delay:80ms"></p>

          <div class="hero__search" data-reveal style="--reveal-delay:160ms">
            <form class="searchbox" data-hero-search novalidate role="search"
                  data-i18n-attr="aria-label:search.formLabel">
              <div class="searchbox__grid">

                <!-- Onde: cidade digitada, escolhida na lista ou pela localização -->
                <div class="searchbox__seg searchbox__seg--where">
                  <button type="button" class="searchbox__field" data-popover-trigger="where"
                          aria-expanded="false" aria-controls="pop-where"
                          data-i18n-attr="aria-label:search.openWhere">
                    <span class="searchbox__label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg><span data-i18n="search.whereLabel"></span></span>
                    <span class="searchbox__value is-empty" data-value="where"></span>
                  </button>

                  <button type="button" class="searchbox__clear" data-clear-where hidden
                          data-i18n-attr="aria-label:search.clearWhere">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                  </button>

                  <div class="popover popover--wide" id="pop-where" data-popover="where" hidden>
                    <div class="popover__search">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
                      <label class="visually-hidden" for="where-input" data-i18n="search.whereLabel"></label>
                      <input class="popover__input" id="where-input" type="search" autocomplete="off"
                             data-where-input data-i18n-attr="placeholder:search.wherePlaceholder">
                    </div>

                    <button type="button" class="popover__action" data-geo-button>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg><span data-i18n="search.useMyLocation"></span>
                    </button>
                    <p class="popover__hint" data-geo-status role="status" aria-live="polite" hidden></p>

                    <p class="popover__group-title" data-i18n="search.popularCities"></p>
                    <div class="popover__list" data-city-list></div>
                  </div>
                </div>

                <!-- Quando -->
                <div class="searchbox__seg">
                  <button type="button" class="searchbox__field" data-popover-trigger="day"
                          aria-expanded="false" aria-controls="pop-day"
                          data-i18n-attr="aria-label:search.openWhen">
                    <span class="searchbox__label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg><span data-i18n="search.whenLabel"></span></span>
                    <span class="searchbox__value" data-value="day"></span>
                  </button>
                  <div class="popover" id="pop-day" data-popover="day" hidden>
                    <div class="popover__list" data-day-list></div>
                  </div>
                </div>

                <!-- Período do dia -->
                <div class="searchbox__seg">
                  <button type="button" class="searchbox__field" data-popover-trigger="time"
                          aria-expanded="false" aria-controls="pop-time"
                          data-i18n-attr="aria-label:search.openTime">
                    <span class="searchbox__label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.4 2"/></svg><span data-i18n="search.timeLabel"></span></span>
                    <span class="searchbox__value" data-value="time"></span>
                  </button>
                  <div class="popover popover--right" id="pop-time" data-popover="time" hidden>
                    <div class="popover__list" data-time-list></div>
                  </div>
                </div>
              </div>

              <button class="btn btn--gradient searchbox__submit" type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg><span data-i18n="search.submit"></span>
              </button>
            </form>

            <!-- Atalhos: localização e as cidades com mais barbearias.
                 Montados por js/main.js a partir de js/data.js. -->
            <div class="searchbox__quick">
              <span class="searchbox__quick-label" data-i18n="search.quickLabel"></span>
              <div class="searchbox__quick-list" data-quick-list></div>
            </div>

            <p class="visually-hidden" role="status" aria-live="polite" data-search-status></p>
          </div>

          <ul class="hero__stats" data-reveal style="--reveal-delay:240ms">
            <li class="stat">
              <p class="stat__value stat__value--gradient" data-count="2847" data-count-suffix="+">2.847+</p>
              <p class="stat__label" data-i18n="hero.stat1Label"></p>
            </li>
            <li class="stat">
              <p class="stat__value" data-count="194320">194.320</p>
              <p class="stat__label" data-i18n="hero.stat2Label"></p>
            </li>
            <li class="stat">
              <p class="stat__value" data-count="4.9" data-count-decimals="1">4,9</p>
              <p class="stat__label" data-i18n="hero.stat3Label"></p>
            </li>
          </ul>
        </div>

        <!-- Barbearias em Destaque: espaço comercial do hero.
             O conteúdo é montado por js/featured.js a partir dos contratos em
             js/featured-data.js cruzados com as barbearias de js/data.js.
             A prova social da plataforma (4,9) continua na lista .hero__stats
             logo acima, então nada de credibilidade se perdeu aqui. -->
        <div class="hero__visual" data-featured-carousel data-reveal="scale" style="--reveal-delay:200ms"></div>
      </div>
    </section>

    <!-- ==================================================================
         SEÇÃO 2 — BARBEARIAS RECOMENDADAS + NOVAS NA INBARBER

         Ranking por mérito (nota + avaliações dos últimos 30 dias), montado
         por js/main.js a partir de js/data.js. O título e o subtítulo são
         escritos pelo JS, e não por data-i18n, porque mudam de chave quando o
         visitante já tem cidade conhecida ("As mais bem avaliadas em {city}").

         Este espaço não se compra: os anúncios ficam no carrossel do hero,
         sempre com selo de "Destaque pago".
         ================================================================== -->
    <section class="section" id="barbearias" aria-labelledby="shops-title">
      <div class="container">
        <div class="section__header section__header--center recs-heading" data-reveal>
          <span class="eyebrow" data-i18n="shops.eyebrow"></span>
          <h2 class="section__title recs-heading__title" id="shops-title" data-recs-title></h2>
          <p class="section__subtitle" data-recs-subtitle></p>
        </div>

        <!-- O ranking tem duas peças: o card de destaque (o #1 da semana, com
             passagem de fotos no hover) e o trilho horizontal com o restante
             da lista, em uma linha só. Ambos são montados por js/main.js. -->
        <div class="recs" role="group" data-featured-shops>
          <div class="recs__hero" data-recs-hero></div>

          <div class="recs__viewport">
            <button type="button" class="rail-btn rail-btn--edge rail-btn--prev" data-recs-prev
                    data-i18n-attr="aria-label:recs.prev" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
            </button>

            <ul class="recs__rail" data-recs-shops aria-describedby="recs-hint"></ul>

            <button type="button" class="rail-btn rail-btn--edge rail-btn--next" data-recs-next
                    data-i18n-attr="aria-label:recs.next" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg>
            </button>
          </div>

          <p class="visually-hidden" id="recs-hint" data-i18n="recs.railHint"></p>
        </div>

        <!-- ================================================================
             Novas na InBarber

             Trilho das últimas barbearias a entrar, em painel próprio com
             acento violeta para não disputar com o dourado do ranking. A
             lista se percorre de quatro formas — setas nas laterais, arrastar,
             setas do teclado (o trilho é focável) e os pontos abaixo, que
             também dizem em que ponto da lista se está.
             ================================================================ -->
        <div class="news" data-reveal>
          <div class="news__header">
            <div class="news__heading">
              <h3 class="news__title" id="news-title">
                <span class="section-mark section-mark--violet" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 13.9 8l5.6 1.9-5.6 1.9L12 17.3l-1.9-5.5L4.5 9.9 10.1 8 12 2.5Z"/><path d="M18.5 14.5 19.4 17l2.6.9-2.6.9-.9 2.5-.9-2.5-2.6-.9 2.6-.9.9-2.5Z" opacity=".6"/></svg>
                </span>
                <span data-i18n="news.title"></span>
              </h3>
              <p class="news__subtitle" data-i18n="news.subtitle"></p>
            </div>
            <p class="news__count" data-news-count hidden></p>
          </div>

          <div class="news__viewport">
            <button type="button" class="rail-btn rail-btn--edge rail-btn--prev" data-news-prev
                    data-i18n-attr="aria-label:news.prev" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
            </button>

            <ul class="news__rail" data-new-shops aria-describedby="news-hint"></ul>

            <button type="button" class="rail-btn rail-btn--edge rail-btn--next" data-news-next
                    data-i18n-attr="aria-label:news.next" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg>
            </button>
          </div>

          <p class="visually-hidden" id="news-hint" data-i18n="news.railHint"></p>
          <div class="news__dots" data-news-dots hidden></div>
        </div>

        <!-- ================================================================
             Abertas agora

             Terceira lista da seção, para quem quer cortar hoje: só entram
             barbearias com as portas abertas neste momento, ordenadas pelo
             mesmo mérito do ranking, e o próximo horário livre já é um link
             de agendamento.

             Mesmo trilho horizontal do bloco de novas — uma linha só, setas,
             arrasto, teclado e pontos —, porque a pergunta aqui é "onde dá
             para cortar agora?" e percorrer é mais rápido do que rolar. O que
             muda é o acento verde e o que cada card mostra: até que horas a
             barbearia fica aberta e o próximo horário livre.
             ================================================================ -->
        <div class="open" data-open-block data-reveal aria-labelledby="open-title">
          <div class="open__header">
            <div class="open__heading">
              <h3 class="open__title" id="open-title">
                <span class="section-mark section-mark--success" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5h16"/><path d="M15 20.5V4.2a1 1 0 0 0-1.2-1L6.8 4.7a1 1 0 0 0-.8 1v14.8"/><path d="M18 20.5V8h-3"/><path d="M12.2 12.4v1.6"/></svg>
                </span>
                <span data-i18n="open.title"></span>
              </h3>
              <p class="open__subtitle" data-open-subtitle></p>
            </div>
            <p class="open__count" data-open-count hidden>
              <span data-open-count-text></span>
            </p>
          </div>

          <div class="open__viewport">
            <button type="button" class="rail-btn rail-btn--edge rail-btn--prev" data-open-prev
                    data-i18n-attr="aria-label:open.prev" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
            </button>

            <ul class="open__rail" data-open-shops aria-describedby="open-hint"></ul>

            <button type="button" class="rail-btn rail-btn--edge rail-btn--next" data-open-next
                    data-i18n-attr="aria-label:open.next" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg>
            </button>
          </div>

          <p class="visually-hidden" id="open-hint" data-i18n="open.railHint"></p>
          <div class="open__dots" data-open-dots hidden></div>
          <p class="open__empty" data-open-empty data-i18n="open.empty" hidden></p>
        </div>

        <div class="shops__footer" data-reveal>
          <a class="btn btn--ghost btn--lg" href="barbearias.html" data-i18n="shops.viewAll"></a>
        </div>
      </div>
    </section>

    <hr class="section__divider">

    <!-- ==================================================================
         SEÇÃO 3 — COMO FUNCIONA
         Um agendamento completo dentro de um notebook (celular abaixo de
         640px), conduzido por js/como-funciona.js. Listas, datas, preços e
         horários da tela são montados lá, a partir do data.js e do idioma.
         ================================================================== -->
    <section class="section how" id="como-funciona" aria-labelledby="how-title">
      <div class="container how__container">
        <div class="section__header section__header--center" data-reveal>
          <span class="eyebrow" data-i18n="how.eyebrow"></span>
          <h2 class="section__title" id="how-title" data-i18n="how.title"></h2>
          <p class="section__subtitle" data-i18n="how.subtitle"></p>
        </div>

        <div class="how-stage" data-how-stage data-step="0">

          <!-- Passos -->
          <div class="how-guide">
            <ol class="how-steps">
            <li class="how-step is-active" data-how-step="0">
              <h3 class="how-step__heading">
                <button class="how-step__trigger" type="button" aria-current="step">
                  <span class="how-step__node">
                    <span aria-hidden="true">1</span>
                    <svg class="how-step__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3,8.5 6.5,12 13,4.5"/></svg>
                  </span>
                  <span class="how-step__title" data-i18n="how.step1.title"></span>
                </button>
              </h3>
              <span class="how-step__rail" aria-hidden="true"><span class="how-step__fill"></span></span>
              <div class="how-step__body">
                <div class="how-step__clip">
                  <p class="how-step__desc" data-i18n="how.step1.desc"></p>
                </div>
              </div>
            </li>
            <li class="how-step" data-how-step="1">
              <h3 class="how-step__heading">
                <button class="how-step__trigger" type="button">
                  <span class="how-step__node">
                    <span aria-hidden="true">2</span>
                    <svg class="how-step__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3,8.5 6.5,12 13,4.5"/></svg>
                  </span>
                  <span class="how-step__title" data-i18n="how.step2.title"></span>
                </button>
              </h3>
              <span class="how-step__rail" aria-hidden="true"><span class="how-step__fill"></span></span>
              <div class="how-step__body">
                <div class="how-step__clip">
                  <p class="how-step__desc" data-i18n="how.step2.desc"></p>
                </div>
              </div>
            </li>
            <li class="how-step" data-how-step="2">
              <h3 class="how-step__heading">
                <button class="how-step__trigger" type="button">
                  <span class="how-step__node">
                    <span aria-hidden="true">3</span>

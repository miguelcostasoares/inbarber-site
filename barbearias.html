<!DOCTYPE html>
<html lang="pt-BR" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <link rel="icon" type="image/png" href="assets/images/inbarber-logo.png">
  <link rel="apple-touch-icon" href="assets/images/inbarber-logo.png">

  <title data-i18n="meta.shops.title">InBarber</title>
  <meta name="description" data-i18n-content="meta.shops.description" content="">

  <!-- Open Graph / redes sociais -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="InBarber">
  <meta property="og:title" data-i18n-content="meta.shops.title" content="">
  <meta property="og:description" data-i18n-content="meta.shops.description" content="">
  <meta property="og:url" content="https://inbarber.com/barbearias.html">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="canonical" href="https://inbarber.com/barbearias.html">

  <!-- Tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS crítico: evita flash de tema claro antes das folhas carregarem -->
  <style>
    html { background: #09090b; }
    body { margin: 0; color: #fafafa; background: #09090b; font-family: "Inter", system-ui, sans-serif; }
    .no-js [data-reveal] { opacity: 1; transform: none; }
  </style>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/sections.css">
  <link rel="stylesheet" href="css/conta.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body data-page="shops">
  <a class="skip-link" href="#main" data-i18n="nav.skip">Pular para o conteúdo</a>

  <!-- ====================================================================
       HEADER — marca à esquerda, ações à direita.
       Sem links de seção: a navegação acontece pelo conteúdo da página.
       ==================================================================== -->
  <header class="header" data-header>
    <div class="container header__inner">
      <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.logoAlt">
        <img class="brand__mark" src="assets/images/inbarber-logo.png" alt="" width="446" height="622" decoding="async">
        <span class="brand__name">In<em>Barber</em></span>
      </a>

      <div class="header__actions">
        <!-- Seletor de idioma: bandeira + código da localidade -->
        <div class="lang-select" data-lang-select>
          <button type="button" class="lang-select__trigger" data-lang-trigger
                  aria-expanded="false" aria-haspopup="true"
                  data-i18n-attr="aria-label:lang.label|title:lang.label">
            <span class="lang-select__flag" data-lang-flag></span>
            <span class="lang-select__code" data-lang-code></span>
            <svg class="lang-select__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="lang-select__menu" role="group" data-lang-menu
               data-i18n-attr="aria-label:lang.menuLabel" hidden></div>
        </div>

        <a class="btn btn--ghost btn--sm header__business" href="para-barbearias.html"
           data-i18n-attr="aria-label:nav.business">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5 5 4h14l1.5 5.5a3 3 0 0 1-5.7 1.6 3 3 0 0 1-5.6 0 3 3 0 0 1-5.7-1.6Z"/><path d="M5 11.4V20h14v-8.6"/><path d="M10 20v-4.5h4V20"/></svg>
          <span class="header__business-full" data-i18n="nav.business"></span>
          <span class="header__business-short" data-i18n="nav.businessShort"></span>
        </a>

        <!-- Conta: sem sessão o botão abre o painel de entrada; com sessão
             ele vira as iniciais do visitante e abre o menu da conta. O
             conteúdo é reescrito por js/conta.js; o que está aqui é o estado
             inicial, que continua legível se o JS não carregar. -->
        <div class="account" data-account>
          <button type="button" class="btn btn--gradient btn--sm header__signin" data-signin
                  data-i18n-attr="aria-label:nav.signIn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 20.5v-1.8a4.2 4.2 0 0 0-4.2-4.2H9.2A4.2 4.2 0 0 0 5 18.7v1.8"/><circle cx="12" cy="7.5" r="3.8"/></svg>
            <span class="header__signin-label" data-i18n="nav.signIn"></span>
          </button>
          <div class="account__menu" data-account-menu hidden></div>
        </div>
      </div>
    </div>
  </header>

  <main id="main">

    <!-- ==================================================================
         BUSCA — cabeçalho da página
         ================================================================== -->
    <section class="page-hero" aria-labelledby="search-title">
      <div class="grid-lines" aria-hidden="true"></div>
      <div class="container page-hero__inner">
        <span class="eyebrow" data-i18n="search.eyebrow" data-reveal></span>
        <h1 class="page-hero__title" id="search-title" data-i18n="search.title" data-reveal style="--reveal-delay:60ms"></h1>
        <p class="page-hero__subtitle" data-i18n="search.subtitle" data-reveal style="--reveal-delay:120ms"></p>

        <div class="page-hero__search" data-reveal style="--reveal-delay:180ms">
          <form class="search-bar" role="search" onsubmit="return false;">
            <label class="visually-hidden" for="shop-search" data-i18n="search.inputLabel"></label>
            <div class="search-bar__field">
              <svg class="search-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
              <input class="search-bar__input" id="shop-search" name="q" type="search" autocomplete="off"
                     data-search-input data-i18n-attr="placeholder:search.placeholder">
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- ==================================================================
         FILTROS + RESULTADOS
         ================================================================== -->
    <section class="section section--tight" aria-labelledby="results-title">
      <div class="container">
        <h2 class="visually-hidden" id="results-title" data-i18n="search.resultsLabel"></h2>

        <form class="filters" data-filters data-reveal>
          <div class="field">
            <label class="field__label" for="filter-city" data-i18n="filters.city"></label>
            <select class="select" id="filter-city" data-filter-city></select>
          </div>

          <div class="field">
            <label class="field__label" for="filter-service" data-i18n="filters.service"></label>
            <select class="select" id="filter-service" data-filter-service></select>
          </div>

          <div class="field">
            <label class="field__label" for="filter-rating" data-i18n="filters.rating"></label>
            <select class="select" id="filter-rating" data-filter-rating>
              <option value="0" data-i18n="filters.anyRating"></option>
              <option value="4.5" data-i18n="filters.rating45"></option>
              <option value="4" data-i18n="filters.rating40"></option>
              <option value="3.5" data-i18n="filters.rating35"></option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="filter-day" data-i18n="filters.day"></label>
            <select class="select" id="filter-day" data-filter-day>
              <option value="any" data-i18n="day.any"></option>
              <option value="today" data-i18n="day.today"></option>
              <option value="tomorrow" data-i18n="day.tomorrow"></option>
              <option value="weekend" data-i18n="day.weekend"></option>
            </select>
          </div>

          <div class="field">
            <label class="field__label" for="filter-time" data-i18n="filters.time"></label>
            <select class="select" id="filter-time" data-filter-time>
              <option value="any" data-i18n="time.any"></option>
              <option value="morning" data-i18n="time.morningShort"></option>
              <option value="afternoon" data-i18n="time.afternoonShort"></option>
              <option value="evening" data-i18n="time.eveningShort"></option>
            </select>
          </div>

          <button type="button" class="btn btn--ghost filters__reset" data-filter-reset data-i18n="filters.reset"></button>
        </form>

        <div class="active-filters" data-active-filters hidden></div>

        <div class="results-bar">
          <p class="results-bar__count" data-results-count role="status" aria-live="polite"></p>

          <div class="field">
            <label class="visually-hidden" for="filter-sort" data-i18n="filters.sort"></label>
            <select class="select" id="filter-sort" data-filter-sort>
              <option value="rating" data-i18n="filters.sortRating"></option>
              <option value="reviews" data-i18n="filters.sortReviews"></option>
              <option value="price" data-i18n="filters.sortPrice"></option>
              <option value="name" data-i18n="filters.sortName"></option>
            </select>
          </div>
        </div>

        <div class="shops-grid" data-shops-grid></div>
      </div>
    </section>

    <!-- ==================================================================
         PREVIEW B2B — transição para a jornada da barbearia
         ================================================================== -->
    <section class="section b2b-preview" aria-labelledby="b2b-preview-title">
      <div class="container">
        <div class="b2b-preview__panel" data-reveal="scale">
          <div class="b2b-preview__content">
            <span class="eyebrow" data-i18n="b2bPreview.eyebrow"></span>
            <h2 class="b2b-preview__title" id="b2b-preview-title" data-i18n="b2bPreview.title"></h2>
            <p class="b2b-preview__desc" data-i18n="b2bPreview.desc"></p>
            <div class="b2b-preview__cta">
              <a class="btn btn--gold btn--lg" href="para-barbearias.html" data-i18n="b2bPreview.cta"></a>
            </div>
          </div>
          <div class="b2b-preview__visual">
            <figure class="framed framed--glow" style="aspect-ratio:4/3">
              <img src="https://images.unsplash.com/photo-1605497788044-5a32c7078486?auto=format&amp;fit=crop&amp;w=900&amp;q=70"
                   data-i18n-attr="alt:b2bPreview.imageAlt" alt="" width="900" height="675" loading="lazy" decoding="async">
            </figure>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ====================================================================
       FOOTER
       ==================================================================== -->
  <footer class="footer">
    <div class="container">
      <div class="footer__grid">
        <div class="footer__brand">
          <a class="brand" href="index.html" data-i18n-attr="aria-label:brand.logoAlt">
            <img class="brand__mark" src="assets/images/inbarber-logo.png" alt="" width="446" height="622" loading="lazy" decoding="async">
            <span class="brand__name">In<em>Barber</em></span>
          </a>
          <p class="footer__tagline" data-i18n="footer.tagline"></p>

          <ul class="footer__social" data-i18n-attr="aria-label:footer.socialLabel">
            <li>
              <a href="https://instagram.com/inbarber" rel="noopener noreferrer" target="_blank" data-i18n-attr="aria-label:footer.social.instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
              </a>
            </li>
            <li>
              <a href="https://tiktok.com/@inbarber" rel="noopener noreferrer" target="_blank" data-i18n-attr="aria-label:footer.social.tiktok">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v12.2a3.8 3.8 0 1 1-3.2-3.75"/><path d="M14 6.2A5.2 5.2 0 0 0 19.5 10"/></svg>
              </a>
            </li>
            <li>
              <a href="https://youtube.com/@inbarber" rel="noopener noreferrer" target="_blank" data-i18n-attr="aria-label:footer.social.youtube">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="m10.5 9.5 5 2.5-5 2.5z"/></svg>
              </a>
            </li>
          </ul>
        </div>

        <nav class="footer__col" data-i18n-attr="aria-label:footer.navLabel">
          <h3 class="footer__col-title" data-i18n="footer.explore"></h3>
          <div class="footer__links">
            <a href="barbearias.html" data-i18n="footer.link.barbershops"></a>
            <a href="index.html#tendencias" data-i18n="footer.link.trends"></a>
            <a href="index.html#como-funciona" data-i18n="footer.link.howItWorks"></a>
            <a href="index.html#avaliacoes" data-i18n="footer.link.reviews"></a>
          </div>
        </nav>

        <div class="footer__col">
          <h3 class="footer__col-title" data-i18n="footer.business"></h3>
          <div class="footer__links">
            <a href="para-barbearias.html#cadastro" data-i18n="footer.link.register"></a>
            <a href="para-barbearias.html#funcionalidades" data-i18n="footer.link.features"></a>
            <a href="para-barbearias.html#cadastro" data-i18n="footer.link.pricing"></a>
          </div>
        </div>

        <div class="footer__col">
          <h3 class="footer__col-title" data-i18n="footer.company"></h3>
          <div class="footer__links">
            <a href="#" data-i18n="footer.link.about"></a>
            <a href="#" data-i18n="footer.link.contact"></a>
            <a href="#" data-i18n="footer.link.careers"></a>
          </div>
        </div>

        <div class="footer__col">
          <h3 class="footer__col-title" data-i18n="footer.legal"></h3>
          <div class="footer__links">
            <a href="#" data-i18n="footer.link.privacy"></a>
            <a href="#" data-i18n="footer.link.terms"></a>
            <a href="#" data-i18n="footer.link.cookies"></a>
          </div>
        </div>
      </div>

      <div class="footer__bottom">
        <p class="footer__legal" data-copyright></p>
        <p class="footer__legal" data-i18n="footer.madeIn"></p>

        <div class="lang-select lang-select--up" data-lang-select>
          <button type="button" class="lang-select__trigger" data-lang-trigger
                  aria-expanded="false" aria-haspopup="true"
                  data-i18n-attr="aria-label:lang.label|title:lang.label">
            <span class="lang-select__flag" data-lang-flag></span>
            <span class="lang-select__code" data-lang-code></span>
            <svg class="lang-select__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="lang-select__menu" role="group" data-lang-menu
               data-i18n-attr="aria-label:lang.menuLabel" hidden></div>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts: ordem obrigatória (dicionário → dados → i18n → interações) -->
  <script src="js/translations.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/conta.js" defer></script>
</body>
</html>
